name: release

# Publishes to PyPI when a version tag (v*) is pushed.
# Uses PyPI Trusted Publishing (OIDC) - no API token is stored in this repository.
# This only works after the owner adds a trusted publisher on PyPI
# (pypi.org > project cap-agent > Publishing: owner juyoung020, repository cap-agent,
#  workflow release.yml, environment pypi) and creates a GitHub environment named "pypi".
# Until then the publish step fails with an "invalid-publisher" error.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME != pyproject version $have"; exit 1; fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cap-agent
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
